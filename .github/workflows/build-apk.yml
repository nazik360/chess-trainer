name: Build debug APK

# Builds the app in GitHub's cloud (Ubuntu runner: JDK, Android SDK, and NDK
# all set up fresh each run) and uploads the resulting APK as a downloadable
# artifact - no local Android Studio / SDK / NDK install needed on your own
# device. Trigger manually from the Actions tab ("Run workflow"), or it runs
# automatically on every push to main.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a full Android SDK (cmdline-tools,
      # platform-tools, several platforms/build-tools) at $ANDROID_HOME -
      # https://github.com/actions/runner-images. We just need to point
      # Gradle/AGP at it and install the one extra piece it doesn't
      # pre-install: the NDK (+ the matching CMake).
      - name: Install NDK + CMake
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-trainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
